name: Update Avatar Catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "RemoteCatalog/update_catalog.py"
      - ".github/workflows/update-avatar-catalog.yml"
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: crystal-avatar-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update current avatar providers
        env:
          CRYSTAL_MAX_ROWS: "350000"
          CRYSTAL_SEEDS_PER_RUN: "24"
          CRYSTAL_RESULTS_PER_QUERY: "750"
          CRYSTAL_DELAY_SECONDS: "0.8"
          CRYSTAL_HOT_ROWS: "12000"
          CRYSTAL_VRCNDB_KEY: \${{ secrets.CRYSTAL_VRCNDB_KEY }}
          CRYSTAL_VRCX_ID: \${{ secrets.CRYSTAL_VRCX_ID }}
        run: python RemoteCatalog/update_catalog.py

      - name: Commit catalog changes
        run: |
          git config user.name "crystal-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/catalog.txt docs/catalog-master.txt docs/catalog-state.json docs/catalog-shards
          if git diff --cached --quiet; then
            echo "No catalog changes"
            exit 0
          fi
          git commit -m "Update current avatar catalog"
          git push
