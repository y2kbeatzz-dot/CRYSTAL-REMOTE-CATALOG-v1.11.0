name: Update Avatar Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: crystal-avatar-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build current Prismic catalog and shards
        env:
          CRYSTAL_ENABLE_PRISMIC: "1"
          CRYSTAL_HOT_ROWS: "12000"
          CRYSTAL_ENABLE_AVTRDB: "0"
          CRYSTAL_ENABLE_AVTRICU: "0"
          CRYSTAL_VRCNDB_KEY: ${{ secrets.CRYSTAL_VRCNDB_KEY }}
          CRYSTAL_VRCX_ID: ${{ secrets.CRYSTAL_VRCX_ID }}
        run: python RemoteCatalog/update_catalog.py

      - name: Commit catalog changes
        run: |
          git config user.name "crystal-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/catalog.txt docs/catalog-state.json docs/catalog-shards
          if git diff --cached --quiet; then
            echo "No catalog changes"
            exit 0
          fi
          git commit -m "Update Prismic avatar catalog"
          git push
