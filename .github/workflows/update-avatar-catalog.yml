name: Update Avatar Catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "RemoteCatalog/update_catalog.py"
      - ".github/workflows/update-avatar-catalog.yml"
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: crystal-avatar-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update catalog
        env:
          CRYSTAL_MAX_PAGES: "1"
          CRYSTAL_SEEDS_PER_RUN: "16"
          CRYSTAL_DELAY_SECONDS: "1.2"
          CRYSTAL_ENABLE_AVTRDB: "1"
          CRYSTAL_ENABLE_AVTRICU: "1"
          CRYSTAL_VRCNDB_KEY: ${{ secrets.CRYSTAL_VRCNDB_KEY }}
        run: python RemoteCatalog/update_catalog.py

      - name: Commit catalog changes
        run: |
          git config user.name "crystal-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/catalog.txt docs/catalog-state.json
          if git diff --cached --quiet; then
            echo "No catalog changes"
            exit 0
          fi
          git commit -m "Update avatar catalog"
          git push
